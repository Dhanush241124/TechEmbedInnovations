<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>TechEmbed Innovation</title>
    <script type="text/javascript">
      // GitHub Pages redirect for client-side routing
      // When a user navigates to a URL that doesn't exist as a file,
      // this script redirects to index.html with the original path as a query parameter
      
      var pathSegments = window.location.pathname.split('/').filter(Boolean);
      var redirectUrl = '/index.html';
      
      // Preserve the path and query string
      if (pathSegments.length > 0) {
        redirectUrl += '?p=' + encodeURIComponent('/' + pathSegments.join('/') + window.location.search);
      }
      
      window.location.replace(redirectUrl);
    </script>
  </head>
  <body>
  </body>
</html>
